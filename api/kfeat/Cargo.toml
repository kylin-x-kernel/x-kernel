[package]
name = "kfeat"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
description = "Top-level feature selection for x-kernel"

[package.metadata.cargo-shear]
# kfeat owns top-level feature forwarding. These optional crates are selected
# through feature edges rather than direct code references.
ignored = ["alloc-engine", "entropy", "fbdevice", "inputdev", "kalloc", "kbpf", "kipi", "kirq", "knet", "krcu", "kspin", "ksync", "ktask", "ktracing", "memspace", "fs_boot", "timer_driver", "procfs", "tee_kernel", "tee_task_iface", "backtrace", "devfs", "kdriver", "kexec", "khal", "kprocess", "kruntime", "ksyscall", "linux_sysno"]

[features]
default = []

# Multicore
smp = [
    "ipi",
    "khal/smp",
    "kruntime/smp",
    "krcu/smp",
    "kxarray/smp",
    "memspace/smp",
    "fs_boot?/smp",
    "ktracing?/smp",
    "ktask/smp",
    "kspin/smp",
    "kplat-aarch64?/smp",
    "kplat-loongarch64?/smp",
    "kplat-riscv64?/smp",
    "kplat-x86_64?/smp",
]

# Floating point/SIMD
fp-simd = ["khal/fp-simd"]

# Virtualization (VMM)
vmm = [
    "devfs/vmm",
    "khal/vmm",
    "kplat-aarch64?/vmm",
    "kplat-x86_64?/vmm",
    "kplat-riscv64?/vmm",
]


# Interrupts
ipi = ["kipi/reschedule", "kipi/timer-reprogram", "kruntime/ipi", "ktask/ipi", "krcu/ipi"]
dma-trace = ["kdriver/dma-trace"]
dev_log = ["devfs/dev-log"]
dice = [
    "dep:tee_kernel",
    "tee_kernel/dice_huk_key",
    "devfs/dice",
]
kvm_guest_mem_share = ["kplat-aarch64?/kvm-guest-mem-share"]
kvm_mmio_guard = ["kplat-aarch64?/kvm-mmio-guard"]
arm_timer_resume_fixup = [
    "kruntime/arm-timer-resume-fixup",
    "ktask/arm-timer-resume-fixup",
    "timer_driver/arm-timer-resume-fixup",
]
rootfs_secondary_block = ["dep:fs_boot", "kruntime/rootfs-secondary-block"]
pci_non_ecam = ["kdriver/pci-non-ecam"]

# Platform wiring
platform_kplat_aarch64 = ["dep:kplat-aarch64", "fp-simd", "smp", "dev_log"]
platform_kplat_x86_64 = ["dep:kplat-x86_64", "fp-simd", "smp", "dev_log"]
platform_kplat_riscv64 = ["dep:kplat-riscv64", "fp-simd", "smp", "dev_log"]
platform_kplat_loongarch64 = ["dep:kplat-loongarch64", "fp-simd", "dev_log"]

# Memory
alloc = ["dep:alloc-engine", "dep:kalloc"]
alloc_tlsf = ["alloc", "alloc-engine/tlsf", "kalloc/tlsf"]
alloc_slab = ["alloc", "alloc-engine/slab", "kalloc/slab"]
alloc_buddy = ["alloc", "alloc-engine/buddy", "kalloc/buddy"]
dma = []

# Task scheduler
sched_stat = ["ktask/sched_stat", "dep:procfs", "procfs/sched_stat"]

# File system
#
# `KFEAT_FS` is a Kconfig-only dependency gate. Cargo features link concrete
# filesystem implementations while kruntime only owns the generic fs stage.
fs_ext4 = ["dep:kext4", "dep:fs_boot", "kruntime/fs"]
fs_fat = ["dep:fat", "dep:fs_boot", "kruntime/fs"]
fs_9p = ["dep:fs_boot", "kruntime/fs9p"]
fs_cgroup2 = ["dep:fs_boot", "kruntime/fs_cgroup2"]
fs_times = ["fs_ext4", "kext4/times"]

# Networking
#
# Subsystem-only. The NIC / vsock transport driver is selected separately via
# the `driver_*` features below.
net = ["dep:knet", "kruntime/net"]
vsock = ["net", "kruntime/vsock", "knet/vsock", "ksyscall/vsock"]

# Display (subsystem only; pick a driver via `driver_*`).
display = ["dep:fbdevice", "kruntime/display"]

# Input (subsystem only; pick a driver via `driver_*`).
input = ["dep:inputdev", "kruntime/input", "devfs/input"]

# Character device class infrastructure.
char = ["kruntime/char", "devfs/serial"]

# Real Time Clock (RTC) Driver.
rtc = ["kruntime/rtc"]

# Device drivers
#
# Each `driver_*` feature pulls in one concrete hardware driver. It does NOT
# automatically enable the corresponding subsystem -- both must be selected
# independently (via Kconfig or by hand). They use underscores so they map
# directly from `KFEAT_DRIVER_*` Kconfig symbols (see
# `scripts/make/kfeat_features.sh`).
driver_virtio_blk = ["kdriver/virtio-blk"]
driver_virtio_net = ["kdriver/virtio-net"]
driver_virtio_gpu = ["kdriver/virtio-gpu"]
driver_virtio_input = ["kdriver/virtio-input"]
driver_virtio_socket = ["kdriver/virtio-socket"]
driver_virtio_9p = ["kdriver/virtio-9p"]
driver_virtio_rng = ["kdriver/virtio-rng"]
entropy_virtio_rng = ["dep:entropy", "entropy/entropy_virtio_rng"]
entropy_arch_cpu = ["dep:entropy", "entropy/entropy_arch_cpu"]
entropy_smccc_trng = ["dep:entropy", "entropy/entropy_smccc_trng"]
entropy_jitter = ["dep:entropy", "entropy/entropy_jitter"]
driver_ramdisk = ["kdriver/ramdisk"]
driver_ramdisk_static = ["kdriver/ramdisk-static"]
driver_ixgbe = ["kdriver/ixgbe"]
driver_fxmac = ["kdriver/fxmac"]
driver_ahci = ["kdriver/ahci"]
driver_bcm2835_sdhci = ["kdriver/bcm2835-sdhci"]
driver_sdmmc = ["kdriver/sdmmc"]
driver_console_pl011 = ["kdriver/console-pl011"]
driver_console_ns16550_mmio = ["kdriver/console-ns16550-mmio"]
driver_console_ns16550_ioport = ["kdriver/console-ns16550-ioport"]
driver_serial_pl011 = ["kdriver/serial-pl011"]
driver_serial_ns16550_mmio = ["kdriver/serial-ns16550-mmio"]
driver_serial_ns16550_ioport = ["kdriver/serial-ns16550-ioport"]

# Backtrace
# In-kernel DWARF symbolication (legacy mode; KFEAT_DWARF)
dwarf = ["backtrace/dwarf"]
# Compact kernel symbol table (kallsyms-style; KFEAT_SYMTAB)
symtab = ["backtrace/symtab"]


# Diagnostics
memtrack = ["dep:kalloc", "kalloc/tracking", "devfs/memtrack"]
snapshot = ["ktask/snapshot"]
sysrq = ["dep:procfs", "procfs/sysrq"]
watchdog = ["kruntime/watchdog", "ksync/watchdog"]
kwork_stall_check = ["watchdog", "dep:kworkng", "kworkng/stall-check"]
workqueue_bench = ["kruntime/workqueue-bench"]
rcu_torture = ["kruntime/rcu-torture"]
rcu_bench = ["kruntime/rcu-bench"]
watchdog_hardlockup = ["kruntime/watchdog_hardlockup"]
irq_context_debug = ["irq_stat", "dep:kirq", "kirq/irq_context_debug"]
irq_stat = ["dep:kirq", "kirq/irq_stat"]
lock_stat = [
    "dep:procfs",
    "procfs/lock_stat",
    "dep:ksync",
    "ksync/stats",
    "dep:kspin",
    "kspin/stats",
]

# TEE
tee = ["dep:tee_kernel", "dep:tee_task_iface", "kexec/tee", "ksyscall/tee"]
tee_ta_sign = [
    "kexec/tee_ta_sign",
    "ksyscall/tee_ta_sign",
    "tee_task_iface/tee_ta_sign",
]
csv_huk_key = ["tee_kernel/csv_huk_key"]
virtcca_huk_key = ["tee_kernel/virtcca_huk_key"]
ta_verify_with_root = ["tee_ta_sign", "tee_task_iface/ta_verify_with_root"]

# Trusty IPC
tipc = ["ksyscall/tipc", "kprocess/tipc", "linux_sysno/tipc"]
vsock_tipc_bridge = ["knet/vsock_tipc_bridge", "kruntime/vsock_tipc_bridge"]

# Pmu
pmu = ["kruntime/pmu", "khal/pmu", "kplat-aarch64?/pmu"]

# NMI
nmi = ["khal/nmi", "kruntime/nmi", "kplat-aarch64?/nmi"]
nmi_pmu = ["khal/nmi_pmu", "kplat-aarch64?/nmi-pmu"]
nmi_mode_pseudo = ["khal/nmi_pseudo", "kplat-aarch64?/nmi-pseudo"]
nmi_mode_hardware = ["khal/nmi_hardware", "kplat-aarch64?/nmi-hardware"]

# Tracepoint
tracepoint = ["ktracing/tracepoint"]

# eBPF
ebpf = ["dep:kbpf", "dep:fs_boot", "ksyscall/ebpf", "kruntime/fs_ebpf"]

[dependencies]
kworkng = { workspace = true, optional = true }
alloc-engine = { workspace = true, optional = true }
memspace = { workspace = true, optional = true }
kalloc = { workspace = true, optional = true }
backtrace.workspace = true
fbdevice = { workspace = true, optional = true }
fat = { workspace = true, optional = true }
kdriver.workspace = true
kirq = { workspace = true, optional = true }
kprocess.workspace = true
kplat-aarch64 = { workspace = true, optional = true, features = [
    "fp-simd",
    "rtc",
] }
kplat-x86_64 = { workspace = true, optional = true, features = [
    "fp-simd",
    "rtc",
] }
kplat-riscv64 = { workspace = true, optional = true, features = [
    "fp-simd",
    "rtc",
] }
kplat-loongarch64 = { workspace = true, optional = true, features = [
    "fp-simd",
    "rtc",
] }
kexec = { workspace = true }
devfs = { workspace = true }
entropy = { workspace = true, optional = true }
khal.workspace = true
inputdev = { workspace = true, optional = true }
kipi = { workspace = true, optional = true }
knet = { workspace = true, optional = true }
kruntime.workspace = true
krcu.workspace = true
kxarray.workspace = true
fs_boot = { workspace = true, optional = true }
timer_driver = { workspace = true, optional = true }
kext4 = { workspace = true, optional = true }
ksync = { workspace = true, optional = true }
ktask = { workspace = true, optional = true }
ksyscall = { workspace = true }
linux_sysno.workspace = true
kspin = { workspace = true, optional = true }
procfs = { workspace = true, optional = true }
tee_kernel = { workspace = true, optional = true }
tee_task_iface = { workspace = true, optional = true }
ktracing = { workspace = true, optional = true }
kbpf = { workspace = true, optional = true }

[lints]
workspace = true
