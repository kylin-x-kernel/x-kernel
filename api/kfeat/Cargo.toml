[package]
name = "kfeat"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
description = "Top-level feature selection for x-kernel"

[features]
default = []

# Multicore
smp = [
    "ipi",
    "khal/smp",
    "kruntime/smp",
    "ktask?/smp",
    "kspin/smp",
    "aarch64-qemu-virt?/smp",
    "loongarch64-qemu-virt?/smp",
    "riscv64-qemu-virt?/smp",
    "x86_64-qemu-virt?/smp",
]

# Floating point/SIMD
fp-simd = ["khal/fp-simd"]

# Virtualization (VMM)
vmm = ["khal/vmm", "aarch64-qemu-virt?/vmm", "x86_64-qemu-virt?/vmm", "riscv64-qemu-virt?/vmm"]


# Interrupts
ipi = ["dep:kipi", "khal/ipi", "kruntime/ipi", "ktask?/ipi"]
dma-trace = ["kdriver/dma-trace"]
dev_log = ["devfs/dev-log"]
dice = ["dep:kalloc", "dep:tee_kernel", "kalloc/dice", "tee_kernel/dice_huk_key", "devfs/dice"]
kvm_guest_mem_share = [
    "aarch64-qemu-virt?/kvm-guest-mem-share",
    "aarch64-peripherals?/kvm-guest-mem-share",
]
kvm_mmio_guard = [
    "aarch64-qemu-virt?/kvm-mmio-guard",
    "aarch64-peripherals?/kvm-mmio-guard",
]
arm_timer_resume_fixup = ["kruntime/arm-timer-resume-fixup", "ktask?/arm-timer-resume-fixup"]
rootfs_secondary_block = ["kruntime/rootfs-secondary-block"]
pci_non_ecam = ["kdriver/pci-non-ecam"]

# Platform wiring
platform_aarch64_qemu_virt = [
    "dep:aarch64-qemu-virt",
    "fp-simd",
    "smp",
    "dev_log",
]
platform_x86_64_qemu_virt = [
    "dep:x86_64-qemu-virt",
    "fp-simd",
    "smp",
    "dev_log",
]
platform_riscv64_qemu_virt = [
    "dep:riscv64-qemu-virt",
    "fp-simd",
    "smp",
    "dev_log",
]
platform_loongarch64_qemu_virt = [
    "dep:loongarch64-qemu-virt",
    "fp-simd",
    "dev_log",
]

# Memory
alloc = ["dep:alloc-engine", "dep:kalloc"]
alloc_tlsf = ["alloc", "alloc-engine/tlsf", "kalloc/tlsf"]
alloc_slab = ["alloc", "alloc-engine/slab", "kalloc/slab"]
alloc_buddy = ["alloc", "alloc-engine/buddy", "kalloc/buddy"]
dma = []

# Task scheduler (driven by core/ktask/Kconfig)
sched_fifo = ["ktask/sched_fifo"]
sched_rr = ["ktask/sched_rr"]
sched_cfs = ["ktask/sched_cfs"]
sched_eevdf = ["ktask/sched_eevdf"]
sched_stat = ["ktask/sched_stat"]

# File system
#
# `KFEAT_FS` is a Kconfig-only dependency gate. Cargo features expose concrete
# filesystem capabilities and let kruntime pull in its internal fs core.
fs_ext4 = ["kruntime/fs_ext4"]
fs_ext4_rsext4 = ["fs_ext4", "kruntime/fs_ext4_rsext4"]
fs_ext4_kext4 = ["fs_ext4", "kruntime/fs_ext4_kext4"]
fs_fat = ["kruntime/fs_fat"]
fs_9p = ["kruntime/fs9p"]
fs_times = ["kruntime/fs_times"]

# Networking
#
# Subsystem-only. The NIC / vsock transport driver is selected separately via
# the `driver_*` features below.
net = ["dep:knet", "kruntime/net"]
vsock = [
    "net",
    "kruntime/vsock",
    "knet/vsock",
    "ksyscall/vsock",
]

# Display (subsystem only; pick a driver via `driver_*`).
display = ["dep:fbdevice", "kruntime/display"]

# Input (subsystem only; pick a driver via `driver_*`).
input = ["dep:inputdev", "kruntime/input", "devfs/input"]

# Character device class infrastructure.
char = ["kruntime/char", "devfs/serial"]

# Real Time Clock (RTC) Driver.
rtc = ["khal/rtc", "kruntime/rtc"]

# Device drivers
#
# Each `driver_*` feature pulls in one concrete hardware driver. It does NOT
# automatically enable the corresponding subsystem -- both must be selected
# independently (via Kconfig or by hand). They use underscores so they map
# directly from `KFEAT_DRIVER_*` Kconfig symbols (see
# `scripts/make/kfeat_features.sh`).
driver_virtio_blk = ["kdriver/virtio-blk"]
driver_virtio_net = ["kdriver/virtio-net"]
driver_virtio_gpu = ["kdriver/virtio-gpu"]
driver_virtio_input = ["kdriver/virtio-input"]
driver_virtio_socket = ["kdriver/virtio-socket"]
driver_virtio_9p = ["kdriver/virtio-9p"]
driver_ramdisk = ["kdriver/ramdisk"]
driver_ramdisk_static = ["kdriver/ramdisk-static"]
driver_ixgbe = ["kdriver/ixgbe"]
driver_fxmac = ["kdriver/fxmac"]
driver_ahci = ["kdriver/ahci"]
driver_bcm2835_sdhci = ["kdriver/bcm2835-sdhci"]
driver_sdmmc = ["kdriver/sdmmc"]
driver_console_pl011 = ["kdriver/console-pl011"]
driver_console_ns16550_mmio = ["kdriver/console-ns16550-mmio"]
driver_console_ns16550_ioport = ["kdriver/console-ns16550-ioport"]
driver_serial_pl011 = ["kdriver/serial-pl011"]
driver_serial_ns16550_mmio = ["kdriver/serial-ns16550-mmio"]
driver_serial_ns16550_ioport = ["kdriver/serial-ns16550-ioport"]

# Backtrace
dwarf = ["backtrace/dwarf"]


# Diagnostics
memtrack = ["dep:kalloc", "kalloc/tracking", "devfs/memtrack"]
snapshot = ["ktask/snapshot"]
sysrq = ["dep:procfs", "procfs/sysrq"]
watchdog = ["kruntime/watchdog", "ksync/watchdog"]
watchdog_hardlockup = [
    "kruntime/watchdog_hardlockup",
    "aarch64-qemu-virt?/nmi",
]
lock_stat = [
    "dep:procfs",
    "procfs/lock_stat",
    "dep:ksync",
    "ksync/stats",
    "dep:kspin",
    "kspin/stats",
]

# TEE
tee = [
    "dep:tee_kernel",
    "dep:tee_task_iface",
    "kexec/tee",
    "ksyscall/tee",
]
tee_ta_sign = ["kexec/tee_ta_sign", "ksyscall/tee_ta_sign", "tee_task_iface/tee_ta_sign"]
csv_huk_key = ["tee_kernel/csv_huk_key"]
virtcca_huk_key = ["tee_kernel/virtcca_huk_key"]
ta_verify_with_root = ["tee_ta_sign", "tee_task_iface/ta_verify_with_root"]

# Trusty IPC
tipc = ["ksyscall/tipc", "kprocess/tipc", "linux_sysno/tipc"]
vsock_tipc_bridge = ["knet/vsock_tipc_bridge", "kruntime/vsock_tipc_bridge"]

# Pmu
pmu = ["kruntime/pmu"]

# Tracepoint
tracepoint = ["ktracing/tracepoint"]

# eBPF
ebpf = ["dep:kbpf", "ksyscall/ebpf", "kruntime/fs_ebpf"]

[dependencies]
alloc-engine = { workspace = true, optional = true }
memspace = { workspace = true, optional = true }
kalloc = { workspace = true, optional = true }
backtrace.workspace = true
fbdevice = { workspace = true, optional = true }
kdriver.workspace = true
kprocess.workspace = true
aarch64-qemu-virt = { workspace = true, optional = true, features = [
    "fp-simd",
    "rtc",
] }
aarch64-peripherals = { workspace = true, optional = true }
x86_64-qemu-virt = { workspace = true, optional = true, features = [
    "fp-simd",
    "rtc",
] }
riscv64-qemu-virt = { workspace = true, optional = true, features = [
    "fp-simd",
    "rtc",
] }
loongarch64-qemu-virt = { workspace = true, optional = true, features = [
    "fp-simd",
    "rtc",
] }
kexec = { workspace = true }
devfs = { workspace = true }
khal.workspace = true
inputdev = { workspace = true, optional = true }
kipi = { workspace = true, optional = true }
knet = { workspace = true, optional = true }
kruntime.workspace = true
ksync = { workspace = true, optional = true }
ktask = { workspace = true, optional = true }
ksyscall = { workspace = true }
linux_sysno.workspace = true
kspin = { workspace = true, optional = true }
procfs = { workspace = true, optional = true }
tee_kernel = { workspace = true, optional = true }
tee_task_iface = { workspace = true, optional = true }
ktracing = { workspace = true, optional = true }
kbpf = { workspace = true, optional = true }
