[package]
name = "kfeat"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
description = "Top-level feature selection for x-kernel"

[features]
default = []

# Multicore
smp = ["khal/smp", "kruntime/smp", "ktask?/smp", "kspin/smp"]

# Floating point/SIMD
fp-simd = ["khal/fp-simd"]


# Interrupts
ipi = [ "dep:kipi", "khal/ipi", "kruntime/ipi"]

crosvm = ["khal/crosvm", "kdriver/crosvm", "kruntime/crosvm"]
dma-trace = ["kdriver/dma-trace"]

# Memory
alloc = ["dep:alloc-engine", "dep:kalloc"]
alloc_tlsf = ["alloc", "alloc-engine/tlsf", "kalloc/tlsf"]
alloc_slab = ["alloc", "alloc-engine/slab", "kalloc/slab"]
alloc_buddy = ["alloc", "alloc-engine/buddy", "kalloc/buddy"]
dma = []

task-ext = ["ktask/task-ext"]
sched-fifo = ["ktask/sched-fifo"]
sched-rr = ["ktask/sched-rr"]
sched-cfs = ["ktask/sched-cfs"]

# File system
fs = [
    "dep:kfs",
]
fs_ext4 = ["kfs/ext4", "kdriver/virtio-blk", "kruntime/fs"]
fs_fat = ["kfs/fat", "kdriver/virtio-blk", "kruntime/fs"]
fs_9p = ["kfs/fs9p", "kdriver/virtio_9p", "kruntime/fs9p"]
fs_times = ["kfs/times"]

# Networking
net = ["kdriver/virtio-net", "dep:knet", "kruntime/net"]
vsock = [
    "kdriver/virtio-socket",
    "kruntime/vsock",
    "knet/vsock",
    "ksyscall/vsock",
    "kservices/vsock",
]

# Display
display = [
    "kdriver/virtio-gpu",
    "dep:fbdevice",
    "kruntime/display",
]

# Input
input = [
    "kdriver/virtio-input",
    "dep:inputdev",
    "kruntime/input",
]

# Real Time Clock (RTC) Driver.
rtc = ["khal/rtc", "kruntime/rtc"]

# Device drivers
bus-mmio = ["kdriver/bus-mmio"]
bus-pci = ["kdriver/bus-pci"]
driver-ramdisk = ["kdriver/ramdisk", "kfs?/use-ramdisk"]

# Backtrace
dwarf = ["backtrace/dwarf"]

# TEE
tee = [
    "dep:tee_kernel",
    "dep:tee_task_iface",
    "kcore/tee",
    "ksyscall/tee",
    "kservices/tee",
]
tee_ta_sign = ["kcore/tee_ta_sign", "tee_task_iface/tee_ta_sign"]
huk_key = ["tee_kernel/huk_key"]

# Watchdog
watchdog = ["kruntime/watchdog"]

# Pmu
pmu = ["kruntime/pmu"]

[dependencies]
alloc-engine = { workspace = true, optional = true }
memspace = { workspace = true, optional = true }
kalloc = { workspace = true, optional = true }
backtrace.workspace = true
fbdevice = { workspace = true, optional = true }
kdriver.workspace = true
kcore = { workspace = true }
kfs = { workspace = true, optional = true }
khal.workspace = true
inputdev = { workspace = true, optional = true }
kipi = { workspace = true, optional = true }
knet = { workspace = true, optional = true }
kruntime.workspace = true
kservices = { workspace = true }
ksync = { workspace = true, optional = true }
ktask = { workspace = true, optional = true }
ksyscall = { workspace = true }
kspin = { workspace = true, optional = true }
tee_kernel = { workspace = true, optional = true }
tee_task_iface = { workspace = true, optional = true }
