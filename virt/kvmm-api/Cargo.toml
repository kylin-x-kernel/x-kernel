[package]
name = "kvmm-api"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Lifecycle-oriented control-plane devices built on the kvmm mechanism crate"

[features]
default = []

[dependencies]
log.workspace = true
kaddr_layout.workspace = true
kcred.workspace = true
ksync.workspace = true
kvfs.workspace = true
kpoll.workspace = true
kvmm.workspace = true
fs_context.workspace = true
linux-raw-sys.workspace = true

# Guest device models are wired per target architecture.
[target.'cfg(target_arch = "riscv64")'.dependencies]
vdev-uart16550.workspace = true
vdev-virtio-net.workspace = true

[target.'cfg(target_arch = "aarch64")'.dependencies]
vdev-vpl011.workspace = true
vdev-virtio-net.workspace = true
memspace.workspace = true
memaddr.workspace = true
