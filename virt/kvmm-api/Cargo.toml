[package]
name = "kvmm-api"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Lifecycle-oriented control-plane devices built on the kvmm mechanism crate"

[package.metadata.cargo-shear]
# Kernel guest fixtures use a read-only irqchip probe and the CPU-id map. They
# are outside cargo-shear's production-source scan.
ignored = ["karch", "kcpu_id_map", "irq_driver"]

[features]
default = []
smp = []
kernel-tests = ["dep:irq_driver", "dep:ktask", "dep:kcpu_id_map", "dep:khal", "dep:karch"]

[dependencies]
kalloc-types.workspace = true
unittest.workspace = true
kirq.workspace = true
log.workspace = true
anon_inodefs.workspace = true
kalloc.workspace = true
kaddr_layout.workspace = true
kcred.workspace = true
khal.workspace = true
kprocess.workspace = true
ksync.workspace = true
ktask.workspace = true
ktime_types.workspace = true
kvfs.workspace = true
kpoll.workspace = true
kvmm.workspace = true
fs_context.workspace = true
linux-raw-sys.workspace = true
memaddr.workspace = true
posix-types.workspace = true

# Guest device models are wired per target architecture.
[target.'cfg(target_arch = "riscv64")'.dependencies]
vdev-uart16550.workspace = true
vdev-virtio-blk.workspace = true
vdev-virtio-net.workspace = true

[target.'cfg(target_arch = "aarch64")'.dependencies]
tock-registers.workspace = true
irq_driver = { workspace = true, optional = true }
ktask = { workspace = true, optional = true }
kcpu_id_map = { workspace = true, optional = true }
khal = { workspace = true, optional = true }
karch = { workspace = true, optional = true }
vdev-vpl011.workspace = true
vdev-virtio-blk.workspace = true
vdev-virtio-net.workspace = true
memspace.workspace = true

[lints]
workspace = true
