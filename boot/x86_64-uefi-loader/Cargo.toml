[package]
name = "x86_64-uefi-loader"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "UEFI loader that prepares and enters the x86_64 x-kernel image"

[dependencies]
# Cargo cannot override default-features on an inherited workspace dependency.
# This explicit path entry mirrors the workspace path while omitting the
# workspace-only boot-info unittest feature for no-alloc boot helpers.
boot_info = { path = "../boot-info", package = "boot-info" }
kbuild_config = { workspace = true }
x86_boot_common = { workspace = true }
uefi = { version = "0.36.1", features = ["alloc", "global_allocator", "logger", "panic_handler"] }
log = "0.4"

[lints]
workspace = true
