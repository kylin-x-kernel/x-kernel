[package]
name = "kworkng"
autobenches = false
version.workspace = true
edition.workspace = true
publish = false
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
description = "Prepared workqueue APIs and safe ownership wrappers"

[features]
# Select live-service integration tests instead of replaceable service fixtures.
system = []
# Kernel-only runner; keep host auto-discovery off. See benches/README.md.
bench = ["system", "dep:klogger"]
stall-check = ["kworkqueue_ng/stall-check", "dep:watchdog", "watchdog/workqueue-stall-check", "dep:kiface"]
self-wait-check = ["kworkqueue_ng/self-wait-check"]

[dependencies]
kworkqueue_ng.workspace = true
kworkerpool_ng.workspace = true
kirq.workspace = true
kspin.workspace = true
klazy.workspace = true
kfinalize.workspace = true
intrusive-collections.workspace = true
khal.workspace = true
ktime_types.workspace = true
kcpu_id_map.workspace = true
ktask.workspace = true
unittest.workspace = true
watchdog = { workspace = true, optional = true }
kiface = { workspace = true, optional = true }
log.workspace = true
klogger = { workspace = true, optional = true }
kbuild_config.workspace = true

[lints]
workspace = true
