[package]
name = "ktimer-core"
description = "Prepared kernel timer storage, expiration and owner locking"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true

[package.metadata.cargo-shear]
# benches/host is a nested host-only workspace with its own manifest: its
# sources belong to that workspace's targets (ownership.rs declares
# `mod ownership_races`), which the outer package-level analysis cannot see.
ignored-paths = ["benches/host/*.rs"]

[features]
default = []
smp = ["kspin/smp"]
preempt = ["kspin/preempt"]

[dependencies]
karch.workspace = true
intrusive-collections.workspace = true
kcpu_id_map.workspace = true
kerrno.workspace = true
kspin.workspace = true
ktime_types.workspace = true
unittest.workspace = true

[lints]
workspace = true
