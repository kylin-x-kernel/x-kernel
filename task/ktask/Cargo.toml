[package]
name = "ktask"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
description = "x-kernel base task management module"

[features]
default = []

snapshot = ["dep:backtrace"]
ipi = ["dep:kipi"]
watchdog = ["snapshot"]
tls = ["khal/tls"]
preempt = ["percpu/preempt", "kspin/preempt"]
smp = ["kspin/smp"]

sched_fifo = []
sched_rr = ["preempt"]
sched_cfs = ["preempt"]
sched_eevdf = ["preempt"]
sched_stat = []
arm-timer-resume-fixup = []

test = ["percpu/sp-naive"]

[dependencies]
kerrno.workspace = true
kidentity.workspace = true
khal.workspace = true
ktime_types.workspace = true
ktime.workspace = true
kcpu_id_map.workspace = true
backtrace = { workspace = true, optional = true }
kipi = { workspace = true, optional = true }
kpoll = { workspace = true }
ksched = { workspace = true }
kiface = { workspace = true }
event-listener = { workspace = true }
futures-util = { version = "0.3", default-features = false, features = [
    "alloc",
    "async-await-macro",
] }
kspin = { workspace = true }
lazyinit = { workspace = true }
log = { workspace = true }
memaddr = { workspace = true }
percpu = { workspace = true }
kbuild_config = { workspace = true }
karch = { workspace = true }
klazy = { workspace = true }
unittest = { workspace = true }
