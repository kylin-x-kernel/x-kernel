[package]
name = "ktask"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
description = "x-kernel base task management module"

[features]
default = []

snapshot = ["dep:backtrace"]
ipi = ["dep:kipi", "kipi/reschedule", "kipi/timer-reprogram"]
watchdog = ["snapshot"]
preempt = ["kspin/preempt", "ktimer_core/preempt"]
smp = ["kspin/smp", "ipi", "ktimer_core/smp"]

sched_stat = []
arm-timer-resume-fixup = []


[dependencies]
kerrno.workspace = true
krcu-core.workspace = true
ktimer_core = { workspace = true, features = ["preempt"] }
kidentity.workspace = true
khal.workspace = true
ktime_types.workspace = true
kirq.workspace = true
kcpu_id_map.workspace = true
kcpu_slot.workspace = true
backtrace = { workspace = true, optional = true }
kipi = { workspace = true, optional = true }
kpoll = { workspace = true }
ksched = { workspace = true }
kiface = { workspace = true }
event-listener = { workspace = true }
futures-util = { version = "0.3", default-features = false, features = [
    "alloc",
    "async-await-macro",
] }
kspin = { workspace = true, features = ["preempt"] }
lazyinit = { workspace = true }
log = { workspace = true }
memaddr = { workspace = true }
kbuild_config = { workspace = true }
karch = { workspace = true }
klazy = { workspace = true }
unittest = { workspace = true }

[lints]
workspace = true
