[package]
name = "ktask"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
description = "x-kernel base task management module"

[features]
default = []

watchdog = ["dep:backtrace"]
task_ext = ["dep:extern-trait"]
tls = ["khal/tls"]
preempt = ["percpu/preempt", "kspin/preempt"]
smp = ["kspin/smp"]

sched_fifo = []
sched_rr = ["preempt"]
sched_cfs = ["preempt"]
sched_eevdf = ["preempt"]

test = ["percpu/sp-naive"]

[dependencies]
kerrno.workspace = true
khal.workspace = true
backtrace = { workspace = true, optional = true }
kpoll = { workspace = true }
ksched = { workspace = true }
cfg-if.workspace = true
cpumask = { version = "0.1" }
crate_interface = { workspace = true }
event-listener = { workspace = true }
extern-trait = { version = "0.2", optional = true }
futures-util = { version = "0.3", default-features = false, features = [
    "alloc",
    "async-await-macro",
] }
kspin = { workspace = true }
lazyinit = { workspace = true }
log = { workspace = true }
memaddr = { workspace = true }
percpu = { workspace = true }
kbuild_config = { workspace = true }
karch = { workspace = true }
