[package]
name = "irq-driver"
description = "IRQ chip drivers with kplat-compatible integration"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
default = []
nmi-hardware = ["kplat/nmi"]
nmi-pseudo = ["karch/nmi-pseudo", "kplat/nmi"]

[dependencies]
karch = { workspace = true }
kirq = { workspace = true }
kbuild_config = { workspace = true }
kcpu_id_map = { workspace = true }
kerrno = { workspace = true }
kiface = { workspace = true }
kplat = { workspace = true }
kspin = { workspace = true }
lazyinit = "0.2"
log = "0.4"
memaddr = { workspace = true }
memspace = { workspace = true }
fwnode = { workspace = true }
rs_fdtree = { workspace = true, features = ["alloc", "fwnode"] }
arm-gic-driver = { workspace = true }

[target.'cfg(target_arch = "aarch64")'.dependencies]
aarch64-cpu.workspace = true
kiface-cpu-api.workspace = true
kcpu_slot.workspace = true
unittest.workspace = true

[target.'cfg(target_arch = "riscv64")'.dependencies]
kalloc-types.workspace = true
riscv = "0.14"
sbi-rt = { version = "0.0.3", features = ["legacy"] }
unittest.workspace = true

[target.'cfg(target_arch = "x86_64")'.dependencies]
acpi = { workspace = true }
x86_apic = { workspace = true }
unittest.workspace = true

[package.metadata.cargo-shear]
# Firmware fixtures and the opt-in SPI delivery fixture use these through
# cfg(unittest) modules, which cargo-shear does not inspect.
ignored = ["rs_fdtree", "kiface-cpu-api"]

[package.metadata.docs.rs]
targets = ["aarch64-unknown-none", "riscv64gc-unknown-none-elf"]

[lints]
workspace = true
