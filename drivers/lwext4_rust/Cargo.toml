[package]
name = "lwext4_rust"
authors = ["Luoyuan Xiao <xiaoluoyuan@163.com>", "Mivik <mivikq@gmail.com>"]
version = "0.2.0"
edition = "2024"
license = "GPL-2.0"
repository.workspace = true
description = "lwext4 in Rust"

links = "lwext4"
build = "build.rs"

[features]
default = ["print", "std"]
print = ["printf-compat"]
std = []

[dependencies]
log = "0.4"
printf-compat = { workspace = true, optional = true }

# See: https://doc.rust-lang.org/cargo/reference/specifying-dependencies.html
[build-dependencies]
bindgen = "0.72"
