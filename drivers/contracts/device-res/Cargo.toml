[package]
name = "device-res"
edition.workspace = true
description = "OS-agnostic device resource model and provider abstraction"
documentation = "https://kylin-x-kernel.github.io/device_res"
keywords = ["driver", "resource", "x-kernel"]
version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
categories.workspace = true

[lib]
name = "device_res"

[package.metadata.cargo-shear]
# ut-tests/lib.rs uses kspin for mock provider and device cleanup locks.
# cargo-shear excludes ut-tests; guest UT still needs this normal dependency.
ignored = ["kspin"]

[dependencies]
kspin = { workspace = true }
ktime_types = { workspace = true }
smallvec = { version = "1.15", features = ["const_generics", "union"] }
unittest = { workspace = true }

[lints]
workspace = true
