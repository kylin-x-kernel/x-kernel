[package]
name = "aarch64-peripherals"
description = "ARM64 common peripheral drivers with `kplat` compatibility"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
default = []
pmr = []
pmu = ["dep:aarch64-pmuv3", "kplat/pmu"]
nmi-pmu = ["pmr", "pmu", "kplat/nmi"]
nmi-sdei = []

[dependencies]
memaddr = { workspace = true }
ktypes = { workspace = true }
kcpu_id_map = { workspace = true }
log = "0.4"
lazyinit = "0.2"
heapless = "0.9"
of = { workspace = true }
karch = { workspace = true }
kplat = { workspace = true }
khal = { workspace = true }
irq_driver = { workspace = true }
aarch64-pmuv3 = { workspace = true, optional = true }
percpu = { workspace = true }

[package.metadata.docs.rs]
targets = ["aarch64-unknown-none"]
