[package]
name = "aarch64-crosvm-virt"
description = "Implementation of `kplat` hardware abstraction layer for CROSVM ARM64 virtual machine."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
fp-simd = ["kcpu/fp-simd", "kernel_boot/fp-simd"]
smp = ["kplat/smp"]
rtc = []

[dependencies]
log = "0.4"
kspin = "0.1"
dw_apb_uart = "0.1"
kcpu = { workspace = true }
karch = { workspace = true }
kplat = { workspace = true }
kernel_boot = { workspace = true }
linkme = { workspace = true }
aarch64-peripherals = { workspace = true, default-features = false }
aarch64-cpu = "10.0"
rs_fdtree = { workspace = true }
of = { workspace = true }
lazyinit = "0.2"
kbuild_config = { workspace = true }
ktypes = { workspace = true }
boot_info = { workspace = true }
kdma = { workspace = true }
kerrno = { workspace = true }

[package.metadata.docs.rs]
targets = ["aarch64-unknown-none"]
