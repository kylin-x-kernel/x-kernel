[package]
name = "aarch64-crosvm-virt"
description = "Implementation of `kplat` hardware abstraction layer for CROSVM ARM64 virtual machine."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
fp-simd = ["kcpu/fp-simd", "kernel_boot/fp-simd"]
smp = ["kplat/smp"]
rtc = ["rtc_driver/pl031"]

[dependencies]
log = "0.4"
kcpu = { workspace = true }
kplat = { workspace = true }
kernel_boot = { workspace = true }
linkme = { workspace = true }
aarch64-peripherals = { workspace = true, default-features = false }
console_driver = { workspace = true, features = ["ns16550-mmio"] }
irq_driver = { workspace = true }
khal = { workspace = true }
kbuild_config = { workspace = true }
ktypes = { workspace = true }
kerrno = { workspace = true }
rtc_driver = { workspace = true }
timer_driver = { workspace = true }

[package.metadata.docs.rs]
targets = ["aarch64-unknown-none"]
