[package]
name = "x86_64-qemu-virt"
description = "Implementation of `kplat` hardware abstraction layer for x86 Standard PC machine."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
fp-simd = ["kcpu/fp-simd", "kernel_boot/fp-simd"]
rtc = ["rtc_driver/cmos"]
smp = ["kplat/smp", "kspin/smp"]
reboot-on-system-off = []

[dependencies]
kernel_boot = { workspace = true }
kspin = { workspace = true }
log = "0.4"
bitflags = "2.6"
percpu = { workspace = true }
kcpu = { workspace = true }
karch = { workspace = true }
kcpu_id_map = { workspace = true }
kplat = { workspace = true }
kbuild_config = { workspace = true }
console_driver = { workspace = true, features = ["ns16550-ioport"] }
x86-peripherals = { workspace = true }
irq_driver = { workspace = true }
khal = { workspace = true }
x86_apic = { workspace = true }
rtc_driver = { workspace = true }
timer_driver = { workspace = true }

[target.'cfg(target_arch = "x86_64")'.dependencies]
x86_64 = { workspace = true }

[package.metadata.docs.rs]
targets = ["x86_64-unknown-none"]
