[package]
name = "x86-peripherals"
description = "x86 common peripheral drivers with `kplat` compatibility"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
default = []
rtc = ["dep:x86_rtc"]

[dependencies]
kspin = { workspace = true }
log = "0.4"
int_ratio = "0.1"
lazyinit = "0.2"
kplat = { workspace = true }
kbuild_config = { workspace = true }
kaddr_layout = { workspace = true }
boot_info = { workspace = true }
multiboot2 = "0.24"

[target.'cfg(target_arch = "x86_64")'.dependencies]
x86_64 = { workspace = true }
x2apic = "0.5"
raw-cpuid = "11.5"
uart_16550 = "0.4"
x86_rtc = { version = "0.1", optional = true }

[package.metadata.docs.rs]
targets = ["x86_64-unknown-none"]
