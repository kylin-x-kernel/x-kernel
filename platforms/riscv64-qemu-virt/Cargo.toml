[package]
name = "riscv64-qemu-virt"
description = "Implementation of `kplat` hardware abstraction layer for QEMU RISC-V virt board."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
fp-simd = ["kcpu/fp-simd"]
rtc = ["rtc_driver/goldfish"]
smp = ["kplat/smp"]

[dependencies]
log = "0.4"

irq_driver = { workspace = true }
khal = { workspace = true }
console_driver = { workspace = true, features = ["ns16550-mmio"] }
kernel_boot = { workspace = true }
percpu = { workspace = true }
kcpu = { workspace = true }
kcpu_id_map = { workspace = true }
karch = { workspace = true }
kerrno = { workspace = true }
kplat = { workspace = true }
kbuild_config = { workspace = true }
rtc_driver = { workspace = true }
timer_driver = { workspace = true }

[target.'cfg(target_arch = "riscv64")'.dependencies]
sbi-rt = { version = "0.0.3", features = ["legacy"] }

[package.metadata.docs.rs]
targets = ["riscv64gc-unknown-none-elf"]
