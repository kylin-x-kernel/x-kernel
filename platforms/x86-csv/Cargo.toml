[package]
name = "x86-csv"
description = "Implementation of `kplat` hardware abstraction layer for x86 Standard PC machine."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
fp-simd = ["kcpu/fp-simd", "kernel_boot/fp-simd"]
rtc = ["x86-peripherals/rtc"]
smp = ["kplat/smp", "kspin/smp"]
reboot-on-system-off = []

[dependencies]
boot_info = { workspace = true }
kernel_boot = { workspace = true }
kspin = { workspace = true }
log = { workspace = true }
bitflags = "2.6"
lazyinit = "0.2"
percpu = { workspace = true }
heapless = "0.9"
kcpu = { workspace = true }
karch = { workspace = true }
kplat = { workspace = true }
kbuild_config = { workspace = true }
x86-peripherals = { workspace = true }

[target.'cfg(target_arch = "x86_64")'.dependencies]
x86_64 = { workspace = true }
multiboot2 = "0.24"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-none"]
