[package]
name = "aarch64-qemu-virt"
description = "Implementation of `kplat` hardware abstraction layer for QEMU ARM64 virtual machine."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
fp-simd = ["kcpu/fp-simd", "kernel_boot/fp-simd"]
rtc = ["rtc_driver/pl031"]
smp = ["kplat/smp"]
nmi = ["aarch64-peripherals/nmi-pmu", "irq_driver/nmi-pmu", "kplat/nmi", "pmu"]
pmu = ["kplat/pmu"]
console-pl011 = ["console_driver/pl011"]
console-ns16550-mmio = ["console_driver/ns16550-mmio"]
kvm-guest-mem-share = ["aarch64-peripherals/kvm-guest-mem-share"]
kvm-mmio-guard = ["aarch64-peripherals/kvm-mmio-guard", "dep:klazy"]

[dependencies]
log = "0.4"
aarch64-peripherals = { workspace = true, default-features = false }
console_driver = { workspace = true }
irq_driver = { workspace = true }
khal = { workspace = true }
kcpu = { workspace = true }
kcpu_id_map = { workspace = true }
kerrno = { workspace = true }
kplat = { workspace = true }
kbuild_config = { workspace = true }
kernel_boot = { workspace = true }
klazy = { workspace = true, optional = true }
rtc_driver = { workspace = true }
timer_driver = { workspace = true }

[package.metadata.docs.rs]
targets = ["aarch64-unknown-none"]
