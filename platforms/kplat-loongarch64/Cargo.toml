[package]
name = "kplat-loongarch64"
description = "Implementation of `kplat` hardware abstraction layer for QEMU LoongArch virtual machine."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[package.metadata.cargo-shear]
ignored = ["kcpu", "kspin"]

[features]
fp-simd = ["kcpu/fp-simd", "kernel_boot/fp-simd"]
rtc = ["rtc_driver/ls7a"]
smp = ["kplat/smp", "kspin/smp"]

[dependencies]
console_driver = { workspace = true, features = ["ns16550-mmio"] }
kspin = { workspace = true }
lazyinit = "0.2"
log = "0.4"

kcpu = { workspace = true }
karch = { workspace = true }
kaddr_layout = { workspace = true }
of = { workspace = true }
khal = { workspace = true }
ktime_types = { workspace = true }
ktime = { workspace = true }
kirq = { workspace = true }
kcpu_id_map = { workspace = true }
kerrno = { workspace = true }
kiface = { workspace = true }
kplat = { workspace = true }
kbuild_config = { workspace = true }
kernel_boot = { workspace = true }
memspace = { workspace = true }
rtc_driver = { workspace = true }
unittest = { workspace = true }

[target.'cfg(target_arch = "loongarch64")'.dependencies]
loongArch64 = "0.2.4"

[package.metadata.docs.rs]
targets = ["loongarch64-unknown-none"]

[lints]
workspace = true
