[package]
name = "procfs"
description = "Procfs support crate for X-Kernel"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[package.metadata.cargo-shear]
# cfg(unittest) assertions in ut-tests/basic_nodes_root.rs use log::LevelFilter;
# cargo-shear ignores ut-tests sources, but guest UT needs a regular dependency.
ignored = ["log"]

[features]
default = []
sysrq = ["ktask/snapshot"]
tee = ["kprocess/tee", "dep:tee_task_iface"]
lock_stat = ["dep:klockstat", "klockstat/stats"]
sched_stat = ["ktask/sched_stat"]
smp = ["ktracing/smp"]
vmm = ["dep:kvmm"]

[dependencies]
kbuild_config.workspace = true
kvfs.workspace = true
macros.workspace = true
kaddr_layout.workspace = true
kalloc.workspace = true
kcpu_id_map.workspace = true
kdevice.workspace = true
kcred.workspace = true
khal.workspace = true
klockstat = { workspace = true, optional = true }
klogger.workspace = true
kprocess.workspace = true
ktask.workspace = true
ktty.workspace = true
ktracing.workspace = true
log.workspace = true
memaddr.workspace = true
memspace.workspace = true
unittest.workspace = true
tee_task_iface = { workspace = true, optional = true }
kvmm = { workspace = true, optional = true }

[target.'cfg(any(target_arch = "riscv32", target_arch = "riscv64"))'.dependencies]
riscv = "0.14"

[lints]
workspace = true
