[package]
name = "rsext4"
version = "0.1.0-pre.0"
edition = "2024"
description = "A lightweight ext4 file system."
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
license = "Apache-2.0"
readme = "README.md"
keywords = ["ext4", "filesystem", "rust"]
categories = ["filesystem"]

[features]
default = ["debug_printf", "debug_assert", "CONFIG_META_CSUM_ENABLE"]
std = []
debug_printf = []
debug_assert = []
own_assert = []
CONFIG_META_CSUM_ENABLE = []

[dependencies]
bitflags = "2.10"
log = "0.4"
