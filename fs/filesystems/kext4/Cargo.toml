[package]
name = "kext4"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Checked ext4 storage core for X-Kernel"
license.workspace = true
homepage.workspace = true
repository.workspace = true
categories = ["filesystem", "no-std"]

[features]
default = []

[dependencies]
bitflags.workspace = true
block = { workspace = true }
ktime_types = { workspace = true }
unittest = { workspace = true }

[target.'cfg(target_os = "none")'.dependencies]
ksync = { workspace = true }
ktask = { workspace = true }

[dev-dependencies]
kalloc = { workspace = true }


[package.metadata.cargo-shear]
# kalloc is indirectly used in tests, so ignore the unused dependency warning
ignored = ["kalloc"]
