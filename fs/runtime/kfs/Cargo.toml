[package]
name = "kfs"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "filesystem module"
license.workspace = true
homepage.workspace = true

[features]
default = []        # TODO: init ramdisk
fat = ["dep:fatfs", "dep:block"]

ext4-lwext4 = ["dep:lwext4_rust"]
ext4-rsext4 = ["dep:rsext4"]
ext4-ext4_rs = ["dep:ext4_rs"]
ext4 = ["ext4-rsext4"]

# 9P subsystem only. The 9P transport driver (e.g. virtio-9p) must be selected
# separately at the top level via `kfeat/driver_virtio_9p`, so non-virtio
# transports can plug in without dragging virtio in here.
fs9p = ["dep:fs9p", "kclass/virtio-9p"]

times = []
std = []
crosvm = []

[dependencies]
kalloc = { workspace = true }
alloc-engine = { workspace = true }
memaddr = { workspace = true }
kclass = { workspace = true, features = ["block"] }
kdevice = { workspace = true }
kerrno = { workspace = true }
kfd = { workspace = true }
ktask = { workspace = true }
kvfs = { workspace = true }
khal = { workspace = true }
kio = { workspace = true, features = ["alloc"] }
kpoll = { workspace = true }
ksync = { workspace = true }
bitflags = "2.10"
cfg-if = { workspace = true }
chrono = { workspace = true }
intrusive-collections = "0.9.7"
log = { workspace = true }
lru = "0.16.0"
slab = { version = "0.4.9", default-features = false }
unittest = { workspace = true }
klazy = { workspace = true }
fs9p = { workspace = true, optional = true }
block = { workspace = true, optional = true }
rsext4 = { workspace = true, optional = true }
ext4_rs = { version = "1.3", optional = true }
lwext4_rust = { version = "0.2.0", default-features = false, optional = true }

[dependencies.fatfs]
workspace = true
default-features = false
optional = true
features = ["alloc", "lfn", "log_level_trace", "unicode"]

[dev-dependencies]
