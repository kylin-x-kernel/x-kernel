vdev-test-mmio = { path = "virt/vdev/test-mmio" }
vdev-uart16550 = { path = "virt/vdev/uart16550" }
vdev-virtio = { path = "virt/vdev/virtio" }
vdev-virtio-blk = { path = "virt/vdev/virtio-blk" }
vdev-virtio-net = { path = "virt/vdev/virtio-net" }
