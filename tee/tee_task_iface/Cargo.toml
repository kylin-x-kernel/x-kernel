[package]
name = "tee_task_iface"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Shared TEE-related task APIs (traits) for x-kernel."
keywords = ["tee", "kernel", "extensions"]
categories = ["os", "no-std"]
documentation.workspace = true

[features]
default = []
# TA ELF `.ta_signature` verification at load time; see `src/tasign.rs` and crate `lib.rs` docs.
tee_ta_sign = [
    "dep:kerrno",
    "dep:kfs",
    "dep:log",
    "dep:spin",
    "dep:tasign",
    "dep:tasign_kernel_shim",
    "dep:xmas-elf",
]
# Enable certificate-chain verification by embedding the built-in CA PEM.
# Effective only when `tee_ta_sign` is also enabled.
ta_verify_with_root = ["tee_ta_sign"]

[dependencies]
cfg-if = { workspace = true }
hashbrown = { workspace = true }
uuid = { version = "0.8", default-features = false }
unittest.workspace = true
kerrno = { workspace = true, optional = true }
kfs = { workspace = true, optional = true }
log = { workspace = true, optional = true }
spin = { workspace = true, optional = true }
tasign = { workspace = true, optional = true, features = ["kernel-verify"] }
tasign_kernel_shim = { workspace = true, optional = true }
xmas-elf = { version = "0.9", default-features = false, optional = true }
tee_raw_sys.workspace = true
