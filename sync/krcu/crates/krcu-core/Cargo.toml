[package]
name = "krcu-core"
description = "RCU reader accounting, grace periods and callback bookkeeping"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true

[package.metadata.cargo-shear]
# kalloc-types supplies KBox owners in path-mounted cfg(unittest) callback and
# service fixtures, plus the reposting fixture shared with cfg(test) host tests.
ignored = ["kalloc-types"]

[dependencies]
kalloc-types.workspace = true
kiface.workspace = true
intrusive-collections.workspace = true
kspin.workspace = true
unittest.workspace = true

[dev-dependencies]
# Host threads race node setup and enrollment; UP exclusion is not a mutex.
kspin = { workspace = true, features = ["smp"] }

[lints]
workspace = true
