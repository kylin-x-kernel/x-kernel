name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .github/copilot-instructions.md
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .github/copilot-instructions.md

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.93.1
          components: rust-src, llvm-tools, rustfmt, clippy
          targets: x86_64-unknown-none,riscv64gc-unknown-none-elf,aarch64-unknown-none-softfloat,loongarch64-unknown-none-softfloat

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: xkernel-copilot
          cache-targets: false

      - name: Install musl toolchain for x86_64
        uses: arceos-org/setup-musl@v1
        with:
          arch: x86_64

      - name: Install musl toolchain for aarch64
        uses: arceos-org/setup-musl@v1
        with:
          arch: aarch64

      - name: Install QEMU and image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            dosfstools \
            e2fsprogs \
            mtools \
            python3 \
            qemu-system-arm \
            qemu-system-misc \
            qemu-system-x86 \
            xz-utils

      - name: Verify key host tools
        run: |
          rustc --version
          cargo --version
          rustup target list --installed
          which rust-objcopy
          which x86_64-linux-musl-gcc
          which qemu-system-x86_64
          which qemu-system-aarch64
          which mkfs.fat
          which mcopy
