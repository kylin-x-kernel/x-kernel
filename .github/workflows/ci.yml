name:  CI Test

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}

jobs:
  precheck:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName !== 'push') {
              core.setOutput('skip', 'false');
              return;
            }
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = `${owner}:${context.ref.replace('refs/heads/','')}`;
            const prs = await github.rest.pulls.list({ owner, repo, head, state: 'open' });
            core.setOutput('skip', prs.data.length > 0 ? 'true' : 'false');

  ci-test:
    needs: precheck
    if: ${{ github.event_name != 'push' || needs.precheck.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    env:
      ARCH: aarch64
      STARRYOS_ROOT: ${{ github.workspace }}/.cache/StarryOS
    steps:
      - name: Checkout Starry Test Harness
        uses: actions/checkout@v4
        with:
          repository: kylin-x-kernel/starry-test-harness
          path: starry-test-harness
      
      - name: Create cache directory
        run: mkdir -p .cache
      
      - name: Checkout StarryOS 
        uses: actions/checkout@v4
        with:
          path: .cache/StarryOS
          submodules: recursive

      - name: Install Rust cache for harness
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: starry-ci-harness

      - name: Install musl toolchain
        uses: arceos-org/setup-musl@v1
        with:
          arch: ${{ env.ARCH }}

      - name: Install QEMU
        uses: arceos-org/setup-qemu@v1
        with:
          version: 10.1.0
          arch_list: ${{ env.ARCH }}

      - name: Install filesystem tools
        run: sudo apt-get update && sudo apt-get install -y e2fsprogs

      - name: 执行 ci-test
        working-directory: starry-test-harness
        run: |
          export STARRYOS_COMMIT=$(git -C ../.cache/StarryOS rev-parse HEAD)
          make ci-test run

      - name: Dump suite logs
        working-directory: starry-test-harness
        if: always()
        run: |
          if [ -d logs/ci ]; then
            find logs/ci -name 'suite.log' -print -exec sh -c 'echo "::group::{}"; cat "$1"; echo "::endgroup::"' _ {} \;
          else
            echo "logs/ci not found"
          fi

      - name: Upload suite artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-${{ github.run_id }}
          path: starry-test-harness/logs/ci
          if-no-files-found: warn
