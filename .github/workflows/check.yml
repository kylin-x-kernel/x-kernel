name: Check

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}

jobs:
  precheck:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName !== 'push') {
              core.setOutput('skip', 'false');
              return;
            }
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = `${owner}:${context.ref.replace('refs/heads/','')}`;
            const prs = await github.rest.pulls.list({ owner, repo, head, state: 'open' });
            core.setOutput('skip', prs.data.length > 0 ? 'true' : 'false');

  rustfmt:
    needs: precheck
    if: ${{ github.event_name != 'push' || needs.precheck.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    needs: precheck
    if: ${{ github.event_name != 'push' || needs.precheck.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            target: aarch64-unknown-none-softfloat
          - arch: x86_64
            target: x86_64-unknown-none
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: "recursive"

      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - uses: arceos-org/setup-musl@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Clippy
        run: cargo clippy -p entry --target ${{ matrix.target }} -F qemu -- -D warnings
