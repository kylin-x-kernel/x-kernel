# Automatically generated Cargo configuration file. Do not edit manually.

include = [
    { path = ".xconfig.toml", optional = true }, # This file is generated by xtask xconfig gen-const. Do not edit manually.
    { path = ".config.toml", optional = true },  # Personal configuration file. You can edit this file to override the default configuration.
]

[env]
RUSTC_BOOTSTRAP = "1"

[build]
rustdocflags = [
    "--cfg",
    "doc",
    "-Z",
    "unstable-options",
    "--enable-index-page",
    "-D",
    "rustdoc::broken_intra_doc_links",
    "--check-cfg",
    "cfg(unittest)",
    "--check-cfg",
    'cfg(k_plat_name, values("kplat-aarch64", "kplat-loongarch64", "kplat-riscv64", "kplat-x86_64"))',
]

[target.aarch64-unknown-none-softfloat]
rustflags = [
    "-C",
    "force-frame-pointers",
    "-C",
    "debuginfo=2",
    "-C",
    "strip=none",
]

[target.riscv64gc-unknown-none-elf]
rustflags = [
    "-C",
    "force-frame-pointers",
    "-C",
    "debuginfo=2",
    "-C",
    "strip=none",
]

[target.loongarch64-unknown-none-softfloat]
rustflags = [
    "-C",
    "force-frame-pointers",
    "-C",
    "debuginfo=2",
    "-C",
    "strip=none",
]

[target.x86_64-unknown-none]
rustflags = [
    "--cfg",
    "aes_backend=\"soft\"",
    "--cfg",
    "curve25519_dalek_backend=\"serial\"",
    "-C",
    "force-frame-pointers",
    "-C",
    "debuginfo=2",
    "-C",
    "strip=none",
]

[alias]
xconfig = "run --manifest-path xtask/xconfig/Cargo.toml --"
convert-cov = "run --manifest-path xtask/convert_cov/Cargo.toml --"
crate-rootfs = "run --manifest-path xtask/crate_rootfs/Cargo.toml --"
gendoc = "run --manifest-path xtask/gendoc/Cargo.toml --"
uapp = "run --manifest-path xtask/uapp/Cargo.toml --"
