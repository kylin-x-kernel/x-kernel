[package]
name = "entry"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "X TeeOS Entry Crate"
license.workspace = true
homepage.workspace = true

[features]
# all of platforms should enable default features
kernel = [
    "kfeat/fs-ext4",
    "kfeat/net",
    "kfeat/rtc",
    "kfeat/sched-rr",
    "kfeat/task-ext",
]

tee = ["kcore/tee", "ksyscall/tee", "kcore/tee_ta_sign"]
smp = ["kfeat/smp"]
unittest = ["dep:unittest"]
dma-trace = ["kfeat/dma-trace"]

# Stubs
pci = ["kfeat/bus-pci"]
mmio = ["kfeat/bus-mmio"]

# qemu default platforms enabled drivers
qemu = [
    "kernel",
    "kfeat/fp-simd",
    "kfeat/display",
    "kfeat/input",
    "kserveices/input",
    "kfeat/vsock",
    "ksyscall/vsock",
    "kserveices/vsock",
    "kfeat/fs-times",
    "kserveices/dev-log",
    "pci",
]

# aarch64-qemu-virt platform
aarch64_qemu_virt = [
    "kernel",
    "qemu",
    "smp",
    "tee",
    # "kfeat/watchdog",
    "dep:aarch64-qemu-virt",
]

x86_64_qemu_virt = ["kernel", "qemu", "dep:x86_64-qemu-virt", "tee"]

riscv64_qemu_virt = [ "kernel", "qemu", "smp", "dep:riscv64-qemu-virt"]

loongarch64_qemu_virt = ["kernel", "qemu", "dep:loongarch64-qemu-virt"]

# pkvm platform
aarch64_crosvm_virt = [
    "kernel",
    "kfeat/fp-simd",
    "kfeat/display",
    "kfeat/input",
    "kserveices/input",
    "kfeat/vsock",
    "ksyscall/vsock",
    "kserveices/vsock",
    "dep:aarch64-crosvm-virt",
    "pci",
    "smp",
    # auxilary features
    "kfeat/fs-times",
    "kserveices/dev-log",
    "kfeat/crosvm",
    "kserveices/dice",
    "tee",
]

[dependencies]
fs-ng-vfs.workspace = true
minicov = "0.3.8"
kfeat.workspace = true
kfs.workspace = true
khal.workspace = true
klogger.workspace = true
kruntime.workspace = true
ksync.workspace = true
ktask.workspace = true
cfg-if.workspace = true
linkme.workspace = true
kprocess.workspace = true
ksyscall.workspace = true
kserveices.workspace = true
kcore.workspace = true
unittest = { workspace = true, optional = true }

[dependencies.aarch64-qemu-virt]
workspace = true
optional = true
features = ["fp-simd", "smp", "rtc"]

[dependencies.x86_64-qemu-virt]
workspace = true
optional = true
features = ["fp-simd", "rtc"]

[dependencies.riscv64-qemu-virt]
workspace = true
optional = true
features = ["fp-simd", "smp", "rtc"]

[dependencies.loongarch64-qemu-virt]
workspace = true
optional = true
features = ["fp-simd", "rtc"]

[dependencies.aarch64-crosvm-virt]
workspace = true
optional = true
features = ["fp-simd", "smp", "rtc"]

[package.metadata.vendor-filter]
platforms = ["riscv64gc-unknown-none-elf", "loongarch64-unknown-none-softfloat"]
all-features = true
