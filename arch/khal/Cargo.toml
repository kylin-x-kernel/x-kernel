[package]
name = "khal"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
description = "Hardware abstraction layer, provides unified APIs for platform-specific operations"

[package.metadata.cargo-shear]
# linkme is kept for feature-gated registration wiring that cargo-shear does
# not see as a direct code reference in every configuration.
ignored = ["linkme"]
ignored-paths = ["src/dummy.rs"]

[features]
default = []
smp = []
fp-simd = ["kcpu/fp-simd",]
vmm = ["kernel_boot/vmm", "kcpu/vmm"]
rtc = []
nmi = ["kplat/nmi", "kcpu/nmi"]
nmi_pseudo = ["kcpu/nmi-pseudo"]
nmi_hardware = ["kcpu/nmi-hardware"]
nmi_pmu = ["nmi", "pmu"]
pmu = ["kplat/pmu"]

irq = []

[dependencies]
kiface-console-api.workspace = true
kiface-task-api.workspace = true
kiface-time-api.workspace = true
kalloc = { workspace = true }
boot_info = { workspace = true }
firmware_handoff = { workspace = true }
kcpu = { workspace = true }
kirq = { workspace = true }
kplat.workspace = true
kerrno.workspace = true
kernel_boot.workspace = true
cfg-if.workspace = true
heapless = "0.9"
kspin.workspace = true
ktime_types.workspace = true
lazyinit.workspace = true
linkme.workspace = true
log.workspace = true
memaddr.workspace = true
kaddr_layout.workspace = true
page_table = { workspace = true }
kiface.workspace = true
acpi = { workspace = true }
of = { workspace = true }
unittest.workspace = true
bitflags = { workspace = true }

[target.'cfg(target_arch = "x86_64")'.dependencies]
multiboot2 = "0.24"

[lints]
workspace = true
