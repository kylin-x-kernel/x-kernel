[package]
name = "kipi"
description = "X-Kernel Inter-Processor Communication API"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
default = []

[dependencies]
kiface.workspace = true
karch = { workspace = true, features = ["smp"] }
# `smp` here compiles khal's SmpStopIf no-op fallback out, so linking this
# crate leaves exactly one provider (this crate's) in the final image.
khal = { workspace = true, features = ["smp"] }
kirq = { workspace = true }
ktime_types.workspace = true
kcpu_id_map.workspace = true
kspin.workspace = true
lazyinit.workspace = true
log.workspace = true
memaddr.workspace = true
page_table = { workspace = true, features = ["smp"] }
percpu.workspace = true
unittest.workspace = true
kbuild_config.workspace = true
