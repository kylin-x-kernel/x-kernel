[package]
name = "entropy"
description = "Kernel entropy pool for /dev/random, getrandom, and TEE consumers"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true

[features]
default = []
entropy_arch_cpu = ["dep:karch"]
entropy_smccc_trng = ["dep:kplat-aarch64"]
entropy_trust_host = []
entropy_jitter = []
entropy_virtio_rng = ["dep:char_driver", "dep:kclass"]

[dependencies]
char_driver = { workspace = true, optional = true }
kclass = { workspace = true, features = ["char"], optional = true }
khal.workspace = true
karch = { workspace = true, optional = true }
klazy.workspace = true
ksync.workspace = true
ktask.workspace = true
log.workspace = true
rand_chacha.workspace = true
unittest.workspace = true

[target.'cfg(target_arch = "aarch64")'.dependencies]
kplat-aarch64 = { workspace = true, default-features = false, optional = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(unittest)'] }
