[package]
name = "x-kernel-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
rs_fdtree = { path = "../drivers/platform/rs-fdtree" }

[[bin]]
name = "fdt_parse"
path = "fuzz_targets/fdt_parse.rs"
test = false
doc = false
bench = false

[profile.release]
incremental = false
codegen-units = 1
