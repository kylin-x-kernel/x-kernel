[package]
name = "xkernel_lints"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "x-kernel Dylint library: every repository lint in one cdylib"

[lib]
crate-type = ["cdylib"]

[dependencies]
dylint_linting = "=6.0.4"

[dev-dependencies]
dylint_testing = "=6.0.4"

[package.metadata.rust-analyzer]
rustc_private = true

# Keep this host compiler tool outside the kernel and xtask workspaces.
[workspace]
