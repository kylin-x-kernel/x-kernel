[package]
name = "cgroup-test"
description = "Cgroup v2 pids controller regression test"
enabled = true
order = 20

[prepare]
env = [
  "RUSTFLAGS=",
  "CC=aarch64-linux-musl-gcc",
  "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-musl-gcc",
]
commands = [
  "cargo build --release --target aarch64-unknown-linux-musl",
]

[[install]]
src = "target/aarch64-unknown-linux-musl/release/cgroup-test"
dest = "/cgroup-test"
mode = "0755"
