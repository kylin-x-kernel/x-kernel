[package]
name = "ksyscall"
description = "Kernel syscall crate for X-Kernel"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true

[features]
vsock = ["knet/vsock", "kservices/vsock"]
tee = [
    "dep:tee_kernel",
    "dep:tee_task_iface",
    "kservices/tee",
]

[dependencies]
kservices = { workspace = true }
kbuild_config = { workspace = true }
kerrno.workspace = true
fs-ng-vfs.workspace = true
kfs.workspace = true
khal.workspace = true
kio.workspace = true
klogger.workspace = true
memspace.workspace = true
memspace_file.workspace = true
knet.workspace = true
kpoll.workspace = true
ksync.workspace = true
ktask.workspace = true
bitflags.workspace = true
bytemuck.workspace = true
kspin.workspace = true
linux-raw-sys = { workspace = true, features = ["ioctl", "loop_device"] }
memaddr.workspace = true
kprocess.workspace = true
ksignal.workspace = true
osvm.workspace = true
linux_sysno.workspace = true
tee_kernel = { workspace = true, optional = true }
tee_task_iface = { workspace = true, optional = true, features = ["tee_ta_sign"] }
kcore.workspace = true
posix-sched.workspace = true
posix-types.workspace = true
num_enum = { version = "0.7", default-features = false }

[target.'cfg(target_arch = "riscv64")'.dependencies]
riscv = "0.14"
